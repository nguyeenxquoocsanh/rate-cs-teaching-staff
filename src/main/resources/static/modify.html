<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="container mt-4">
        <h1>Modify Staff Member</h1>
        <p class="text-muted">Editing Staff ID: <span th:text="${individualStaff.id}"></span></p>
    </div>
    
    <section class="container mt-3">
        <form th:action="@{/users/update/{id}(id=${individualStaff.id})}" method="post">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" th:value="${individualStaff.name}" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" th:value="${individualStaff.email}" required>
            </div>
            <div class="mb-3">
                <label for="roleType" class="form-label">Role Type</label>
                <input type="text" class="form-control" id="roleType" name="roleType" th:value="${individualStaff.roleType}" required>
            </div>
            <div class="mb-3">
                <label for="clarity" class="form-label">Clarity</label>
                <input type="number" class="form-control" id="clarity" name="clarity" min="1" max="5" th:value="${individualStaff.clarity}" required>
            </div>
            <div class="mb-3">
                <label for="niceness" class="form-label">Niceness</label>
                <input type="number" class="form-control" id="niceness" name="niceness" min="1" max="5" th:value="${individualStaff.niceness}" required>
            </div>
            <div class="mb-3">
                <label for="knowledgeableScore" class="form-label">Knowledgeable Score</label>
                <input type="number" class="form-control" id="knowledgeableScore" name="knowledgeableScore" min="1" max="5" th:value="${individualStaff.knowledgeableScore}" required>
            </div>
            <div class="mb-3">
                <label for="comment" class="form-label">Comment</label>
                <textarea class="form-control" id="comment" name="comment" th:text="${individualStaff.comment}"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
            
            <a href="/users/view" class="btn btn-secondary ms-2">Cancel</a>
        </form>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Staff Ratings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container mt-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>CS Teaching Staff Ratings</h1>
            <a href="/users/add" class="btn btn-success">Add New Rating</a>
        </div>
        
        <table class="table table-striped table-hover border">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Overall Score (Avg)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="staff : ${staff}">
                    <td th:text="${staff.name}"></td>
                    <td th:text="${staff.roleType}"></td>

                    <td th:text="${staff.getAverageRating()} + ' / 10'"></td>

                    <td>
                        <a th:href="@{/users/view/{id}(id=${staff.id})}" class="btn btn-sm btn-primary">View Details</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
